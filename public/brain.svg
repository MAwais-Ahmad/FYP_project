<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant indigo to violet gradient -->
    <linearGradient id="gradient-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <!-- Accent pink/purple gradient -->
    <linearGradient id="gradient-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Glow filters for premium glass/neon effect -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background container for maskable PWA criteria -->
  <rect width="512" height="512" rx="112" fill="#0b0f19" />

  <!-- Outer ambient glow -->
  <circle cx="256" cy="256" r="160" fill="url(#gradient-primary)" opacity="0.12" filter="url(#glow-heavy)" />

  <g transform="translate(20, 20)" filter="url(#glow-light)">
    <!-- LEFT HEMISPHERE (Analytical lines & grids) -->
    <!-- Brain silhouette outline (Analytical style) -->
    <path d="M 236,90 
             C 170,90 120,130 110,190 
             C 90,210 80,240 90,270 
             C 90,320 120,360 160,370 
             C 170,390 190,410 236,410
             L 236,90 Z" 
          fill="none" 
          stroke="url(#gradient-primary)" 
          stroke-width="8" 
          stroke-linejoin="round"
          stroke-linecap="round" />
          
    <!-- Inside grid lines -->
    <path d="M 120,230 L 236,230" stroke="#6366f1" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
    <path d="M 140,290 L 236,290" stroke="#6366f1" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
    <path d="M 145,170 L 236,170" stroke="#6366f1" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
    <path d="M 180,95 C 180,95 180,180 236,200" fill="none" stroke="url(#gradient-primary)" stroke-width="5" opacity="0.8" />
    
    <!-- LEFT Nodes (Analytical) -->
    <circle cx="110" cy="190" r="8" fill="#818cf8" />
    <circle cx="90" cy="270" r="10" fill="#6366f1" />
    <circle cx="160" cy="370" r="8" fill="#4f46e5" />
    <circle cx="160" cy="200" r="6" fill="#818cf8" />
    <circle cx="130" cy="300" r="6" fill="#6366f1" />

    <!-- RIGHT HEMISPHERE (Creative, flowing curves & organic shapes) -->
    <path d="M 236,90 
             C 302,90 352,130 362,190 
             C 382,210 392,240 382,270 
             C 382,320 352,360 312,370 
             C 302,390 282,410 236,410
             L 236,90 Z" 
          fill="none" 
          stroke="url(#gradient-accent)" 
          stroke-width="8" 
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Flowing abstract pathways -->
    <path d="M 236,130 C 290,140 330,170 340,210 C 350,250 310,290 280,280 C 250,270 240,320 236,370" 
          fill="none" 
          stroke="url(#gradient-accent)" 
          stroke-width="6" 
          stroke-linecap="round" />
          
    <path d="M 236,220 C 310,220 360,260 340,310 C 320,360 280,360 256,390" 
          fill="none" 
          stroke="url(#gradient-accent)" 
          stroke-width="5" 
          stroke-linecap="round" 
          opacity="0.8" />

    <!-- RIGHT Nodes (Creative/Organic) -->
    <circle cx="362" cy="190" r="10" fill="#f472b6" />
    <circle cx="382" cy="270" r="12" fill="#db2777" />
    <circle cx="312" cy="370" r="8" fill="#f472b6" />
    <circle cx="280" cy="170" r="7" fill="#db2777" />
    <circle cx="300" cy="280" r="9" fill="#f472b6" />
    <circle cx="290" cy="220" r="6" fill="#db2777" />

    <!-- Central Core Connection (Synaptic Bridge) -->
    <line x1="236" y1="90" x2="236" y2="410" stroke="#ffffff" stroke-width="4" opacity="0.4" stroke-dasharray="10 10" />
    <circle cx="236" cy="150" r="8" fill="#ffffff" filter="url(#glow-light)" />
    <circle cx="236" cy="250" r="9" fill="#ffffff" filter="url(#glow-light)" />
    <circle cx="236" cy="340" r="8" fill="#ffffff" filter="url(#glow-light)" />
  </g>
</svg>
